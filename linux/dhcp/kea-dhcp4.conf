// /etc/kea/kea-dhcp4.conf  -  Kea DHCPv4 on srv01.corp.lab
// Every client VLAN is reached through a relay (ip helper-address 192.168.50.10
// on HQ-R1/BR-R2). Kea picks the subnet from the relay's giaddr.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "br-vlan50/192.168.50.10" ],
      "dhcp-socket-type": "udp"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "valid-lifetime": 7200,
    "renew-timer": 1800,
    "rebind-timer": 3600,
    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.50.10" },
      { "name": "domain-name", "data": "corp.lab" },
      { "name": "domain-search", "data": "corp.lab" }
    ],
    "subnet4": [
      { "id": 10, "subnet": "192.168.10.0/24",
        "pools": [ { "pool": "192.168.10.100 - 192.168.10.199" } ],
        "option-data": [ { "name": "routers", "data": "192.168.10.1" } ] },
      { "id": 20, "subnet": "192.168.20.0/24",
        "pools": [ { "pool": "192.168.20.100 - 192.168.20.199" } ],
        "option-data": [ { "name": "routers", "data": "192.168.20.1" } ] },
      { "id": 30, "subnet": "192.168.30.0/24",
        "pools": [ { "pool": "192.168.30.100 - 192.168.30.199" } ],
        "option-data": [ { "name": "routers", "data": "192.168.30.1" } ] },
      { "id": 40, "subnet": "192.168.40.0/24",
        "pools": [ { "pool": "192.168.40.100 - 192.168.40.199" } ],
        "option-data": [ { "name": "routers", "data": "192.168.40.1" } ] },
      { "id": 60, "subnet": "192.168.60.0/24",
        "pools": [ { "pool": "192.168.60.100 - 192.168.60.199" } ],
        "option-data": [ { "name": "routers", "data": "192.168.60.1" } ] }
    ],
    "loggers": [ {
      "name": "kea-dhcp4",
      "output_options": [ { "output": "syslog" } ],
      "severity": "INFO"
    } ]
  }
}
