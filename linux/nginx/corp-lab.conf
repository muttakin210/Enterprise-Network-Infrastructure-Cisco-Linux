# /etc/nginx/sites-available/corp-lab  -  intranet test site on srv01
server {
    listen 80 default_server;
    server_name srv01.corp.lab www.corp.lab intranet.corp.lab 192.168.50.10;

    root /var/www/corp-lab;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/corp-lab.access.log;
    error_log  /var/log/nginx/corp-lab.error.log;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
