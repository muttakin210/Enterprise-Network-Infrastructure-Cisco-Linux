# /etc/snmp/snmpd.conf  -  SNMPv3-only agent on srv01.corp.lab
# The v3 user is created separately (secrets are never stored in the repo):
#   net-snmp-create-v3-user -ro -a SHA -A '<AUTH>' -x AES -X '<PRIV>' monitor
agentAddress udp:161
sysLocation  CORP-HQ, server room, VLAN 50
sysContact   netadmin@corp.lab
sysName      srv01.corp.lab
sysServices  72

# authPriv required; no v1/v2c communities are defined
rouser monitor priv

# disk, load and process checks visible to LibreNMS
includeAllDisks 10%
load 4 3 2
proc sshd
proc nginx
proc named
