# /etc/rsyslog.d/10-remote-devices.conf  -  central Syslog for Cisco devices
# Listens on UDP and TCP 514. Only the remote input is bound to the "remote"
# ruleset, so local logs are untouched. One file per device under /var/log/remote/.
module(load="imudp")
module(load="imtcp")

template(name="PerHostFile" type="string"
         string="/var/log/remote/%HOSTNAME%.log")
template(name="DeviceFormat" type="string"
         string="%timegenerated:::date-rfc3339% %fromhost-ip% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

ruleset(name="remote") {
    action(type="omfile" dynaFile="PerHostFile" template="DeviceFormat"
           dirCreateMode="0750" fileCreateMode="0640")
    # one combined file makes "grep across the network" easy
    action(type="omfile" file="/var/log/remote/all-devices.log" template="DeviceFormat")
    stop
}

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")
