! =====================================================================
! OPTIONAL EXTENSION (guide section 9): Guest VLAN 60 at HQ + GUEST-FILTER
! Apply ONLY after VLAN 60 exists on HQ-SW1 and the trunk carries it.
! =====================================================================
! --- HQ-SW1 ---
configure terminal
vlan 60
 name GUEST
interface GigabitEthernet0/0
 switchport trunk allowed vlan add 60
end
!
! --- HQ-R1 ---
configure terminal
interface GigabitEthernet0/0.60
 description VLAN60-GUEST
 encapsulation dot1Q 60
 ip address 192.168.60.1 255.255.255.0
 ip helper-address 192.168.50.10
 ip access-group GUEST-FILTER in
!
ip access-list extended GUEST-FILTER
 remark Guests: DHCP, DNS and web to the server only; no other internal access
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.60.0 0.0.0.255 host 192.168.50.10 eq domain
 permit tcp 192.168.60.0 0.0.0.255 host 192.168.50.10 eq www
 deny   ip 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255 log
 deny   ip 192.168.60.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 deny   ip 192.168.60.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 permit ip any any
!
router ospf 1
 network 192.168.60.0 0.0.0.255 area 0
end
write memory
